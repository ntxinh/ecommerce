openapi: 3.1.0
info:
  title: Marketflow API
  version: "0.1.0"
  description: >-
    REST surface under /api/v1. Session-cookie auth (getActor) — mutating routes
    return 401 UNAUTHORIZED without a session. Errors always serialize as
    {error: {code, message}} via toErrorResponse.
paths:
  /api/v1/health:
    get:
      summary: Liveness probe
      description: No dependency checks; always 200 when the app is up.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
  /api/v1/ready:
    get:
      summary: Readiness probe
      description: >-
        200 only when the DB answers a trivial query; 500 (INTERNAL) otherwise.
        No dependency details leaked.
      responses:
        "200":
          description: DB reachable.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ready]
        "500":
          description: DB unreachable.
  /api/v1/internal/auto-complete:
    post:
      summary: Cron sweep — auto-complete delivered seller orders
      description: >-
        Internal job. Bearer INTERNAL_CRON_TOKEN, not a session cookie.
        DELIVERED seller orders whose last DELIVERED tracking event is older
        than application_settings.auto_complete_days move to COMPLETED.
      responses:
        "200":
          description: Sweep ran.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [completed]
                    properties:
                      completed:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cart:
    get:
      summary: Current session user's cart
      responses:
        "200":
          description: Cart view, grouped per shop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cart/items:
    post:
      summary: Add a variant to the cart (additive upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartAddInput"
      responses:
        "200":
          description: Full cart view after the add.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Variant missing or not sellable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Remove one cart line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartRemoveInput"
      responses:
        "200":
          description: Full cart view after the removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Cart line not found for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/checkout:
    post:
      summary: Place an order from cart lines
      description: >-
        Single transaction: idempotency replay → server-side repricing →
        voucher validation → guarded stock reservation → order/seller_order/
        payment writes. The Idempotency-Key header wins over the body's
        idempotencyKey field; a completed replay returns the same order.
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            minLength: 8
            maxLength: 128
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Order placed (or idempotent replay).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PlaceOrderResult"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Address belongs to a different user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Cart line or address not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: INSUFFICIENT_STOCK or IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: >-
            Unprocessable: INVALID_INPUT for shippingByShop keys naming shops
            not in the order, unknown shipping method, unsupported payment
            method, or VOUCHER_INVALID. (INVALID_INPUT is 400 for malformed
            JSON or failed contract validation.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/webhooks/stripe:
    post:
      summary: Stripe webhook sink
      description: >-
        Unauthenticated but signature-verified (Stripe-Signature header against
        STRIPE_WEBHOOK_SECRET). Handles checkout.session.completed/expired,
        async_payment_* and payment_intent.payment_failed; dedupes on
        payment_attempts.provider_ref. 404 when the webhook secret isn't
        configured, 400 on a bad signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event acknowledged (handled, ignored, or unknown ref).
        "400":
          description: Signature verification failed.
        "404":
          description: Stripe webhook not configured on this deployment.
  /api/v1/webhooks/finix:
    post:
      summary: Finix webhook sink
      description: >-
        Unauthenticated but signature-verified (Finix-Signature header
        `timestamp=<epoch>,sig=<hex>` → HMAC-SHA256 of "<ts>:<body>" against
        FINIX_WEBHOOK_SECRET, the webhook's secret_signing_key). Handles
        transfer created/updated events carrying state SUCCEEDED/FAILED;
        resolves the attempt via checkout_form_id / tags / external_ref and
        dedupes on payment_attempts. 404 when the secret isn't configured,
        400 on a bad signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event acknowledged (handled, ignored, or unknown ref).
        "400":
          description: Signature verification failed.
        "404":
          description: Finix webhook not configured on this deployment.
  /api/v1/search:
    get:
      summary: Search products or fetch autocomplete suggestions
      description: >-
        Public, ACTIVE products only. q matches name/sku/brand/description;
        relevance sort ranks name > sku/brand > description (documented
        heuristic). mode=suggest returns product names for autocomplete and
        ignores filters/pagination. Authenticated calls write search_history.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - in: query
          name: mode
          schema:
            type: string
            enum: [search, suggest]
            default: search
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, newest, popular]
            default: relevance
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: shopId
          schema:
            type: string
        - in: query
          name: minPriceVnd
          schema:
            type: integer
            minimum: 0
        - in: query
          name: maxPriceVnd
          schema:
            type: integer
            minimum: 0
        - in: query
          name: minRating
          schema:
            type: number
            minimum: 0
            maximum: 5
        - in: query
          name: inStock
          schema:
            type: string
            enum: ["true", "false"]
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: >-
            Search mode → {data: {items: ProductCard[], total, nextCursor}};
            suggest mode → {data: {suggestions: string[]}}.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: object
                        required: [items, total, nextCursor]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                          total:
                            type: integer
                          nextCursor:
                            type: string
                            nullable: true
                      - type: object
                        required: [suggestions]
                        properties:
                          suggestions:
                            type: array
                            items:
                              type: string
        "400":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/products:
    get:
      summary: List product cards or fetch cards by ids
      description: >-
        Public, ACTIVE products only. `?ids=a,b,c` returns cards for exactly
        those ids in the caller's order (max 50; used by the recently-viewed
        rail). Without `ids`, the remaining params mirror listProducts
        (categoryId includes descendants; price/rating apply to the min
        effective variant price) for client-side cursor pagination.
      parameters:
        - in: query
          name: ids
          schema: { type: string, maxLength: 2000 }
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: shopId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: minPriceVnd
          schema: { type: integer, minimum: 0 }
        - in: query
          name: maxPriceVnd
          schema: { type: integer, minimum: 0 }
        - in: query
          name: minRating
          schema: { type: number, minimum: 0, maximum: 5 }
        - in: query
          name: inStock
          schema: { type: string, enum: ["true", "false"] }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, price_asc, price_desc, rating], default: newest }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: "{data: {items: ProductCard[], nextCursor}} — nextCursor null in ids mode."
        "400":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/notifications:
    get:
      summary: List the session user's notifications
      description: >-
        Newest first, ULID-desc keyset cursor (max 50). Returns
        {data: {items, nextCursor, unread}}. Item `title` is an i18n key under
        the `notifications` namespace and `body` its JSON interpolation params;
        `href` is a locale-free path — clients prepend the locale.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Notification page + unread count.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, nextCursor, unread]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, type, title, body, href, readAt, createdAt]
                          properties:
                            id: { type: string }
                            type:
                              type: string
                              enum: [account, seller_application, order, payment, shipment, return, voucher]
                            title: { type: string }
                            body: { type: string }
                            href: { type: string, nullable: true }
                            readAt: { type: integer, nullable: true }
                            createdAt: { type: integer }
                      nextCursor:
                        type: string
                        nullable: true
                      unread:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Mark notifications read
      description: "{id} marks one (owner only); {} marks all. Returns {data: {marked}}."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: "{data: {marked}} — count of notifications marked read."
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Notification belongs to a different user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Notification id not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/reviews:
    post:
      summary: Create a review for a purchased order item
      description: >-
        Session auth required. The item's parent order must belong to the
        caller and be in DELIVERED, COMPLETED, or PARTIALLY_REFUNDED; one
        review per order item (UNIQUE order_item_id). Members of the product's
        shop can't review it (ADMIN exempt). Returns {data: {id}} with 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderItemId, rating]
              properties:
                orderItemId: { type: string, minLength: 1 }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
                images:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uri }
      responses:
        "201":
          description: Created — {data: {id: "rev_…"}}.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the order's buyer, or the product's own shop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Order item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: Order not yet fulfilled (PENDING_PAYMENT…SHIPPED, CANCELLED, REFUNDED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/reviews/[id]:
    patch:
      summary: Update a review (author) or moderate it (admin)
      description: >-
        Two modes in one body. Author mode: {rating?, title?, body?} — at
        least one field required; empty string clears title/body. Admin mode:
        {action: "HIDE"|"UNHIDE", note?} flips status PUBLISHED↔HIDDEN and
        appends a "review.moderate" audit row. Hidden reviews are excluded
        from product lists and rating aggregates.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 200, nullable: true }
                body: { type: string, maxLength: 5000, nullable: true }
                action: { type: string, enum: [HIDE, UNHIDE] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: "{data: {id}} — updated or moderated."
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Author-edit by another user, or moderation by a non-admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Review not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Delete a review (author or admin)
      description: >-
        Removes the row; the order item becomes reviewable again. Admins may
        delete any review.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{data: {deleted: true}}"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the review author or an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Review not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  responses:
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InvalidInput:
      description: Malformed JSON or failed contract validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - INVALID_INPUT
                - NOT_FOUND
                - INSUFFICIENT_STOCK
                - VOUCHER_INVALID
                - IDEMPOTENCY_CONFLICT
                - INTERNAL
            message:
              type: string
    CartLine:
      type: object
      required:
        - cartItemId
        - variantId
        - productId
        - name
        - sku
        - attrs
        - unitPriceVnd
        - qty
        - available
        - shopId
        - shopName
      properties:
        cartItemId:
          type: string
        variantId:
          type: string
        productId:
          type: string
        name:
          type: string
        sku:
          type: string
        attrs:
          type: object
          additionalProperties: true
        unitPriceVnd:
          type: integer
        qty:
          type: integer
        available:
          type: boolean
        shopId:
          type: string
        shopName:
          type: string
    CartView:
      type: object
      required: [cartId, items, byShop, subtotalVnd]
      properties:
        cartId:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"
        byShop:
          type: array
          items:
            type: object
            required: [shopId, shopName, items]
            properties:
              shopId:
                type: string
              shopName:
                type: string
              items:
                type: array
                items:
                  $ref: "#/components/schemas/CartLine"
        subtotalVnd:
          type: integer
    CartResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CartView"
    CartAddInput:
      type: object
      required: [variantId, qty]
      properties:
        variantId:
          type: string
          minLength: 1
        qty:
          type: integer
          minimum: 1
          maximum: 999
    CartRemoveInput:
      type: object
      required: [cartItemId]
      properties:
        cartItemId:
          type: string
          minLength: 1
    CheckoutInput:
      type: object
      required: [cartItemIds, addressId, paymentMethod]
      properties:
        cartItemIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            minLength: 1
        addressId:
          type: string
          minLength: 1
        shippingByShop:
          type: object
          description: shopId → shipping method name; fee priced server-side.
          additionalProperties:
            type: string
            minLength: 1
          default: {}
        voucherCodes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
          default: []
        paymentMethod:
          type: string
          enum: [COD, MOCK_WALLET, MOCK_BANK, STRIPE, FINIX]
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
        simulate:
          type: string
          enum: [success, failure]
          description: Dev option forcing the mock wallet outcome.
    PlaceOrderResult:
      type: object
      required: [orderId, sellerOrderIds, status]
      properties:
        orderId:
          type: string
        sellerOrderIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - PENDING_PAYMENT
            - PAID
            - PROCESSING
            - SHIPPED
            - DELIVERED
            - COMPLETED
            - CANCELLED
            - PAYMENT_FAILED
            - PARTIALLY_REFUNDED
            - REFUNDED
        redirectUrl:
          type: string
          description: >-
            STRIPE/FINIX only — hosted checkout URL the client must redirect
            to; the order stays PENDING_PAYMENT until the webhook settles it.
